name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck, lint, format, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run coverage
      - run: npx vite build

  hardware:
    name: Clip geometry
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hardware/clip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hardware/clip/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python clip.py
      - uses: actions/upload-artifact@v4
        with:
          name: clip-models
          path: hardware/clip/out/
